name: Daily TW Stock Scan

on:
  schedule:
    # 07:30 UTC = 15:30 台灣時間,週一到週五
    # 不能用 14:00:三大法人買賣超資料是收盤後才公布,14:00 抓不到當天籌碼(README 也是這樣寫的)
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 寫入個人設定(watchlist / 持股 / 收件信箱)
        env:
          CONFIG_LOCAL_JSON: ${{ secrets.CONFIG_LOCAL_JSON }}
        run: printf '%s' "$CONFIG_LOCAL_JSON" > config.local.json

      - name: 從 Google Drive 下載 chips.db / trades.db
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python gdrive_sync.py pull

      - name: 執行掃描並寄信
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python tw_stock_monitor_v2.py

      - name: 把更新後的 chips.db / trades.db 傳回 Google Drive
        if: always()
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python gdrive_sync.py push
