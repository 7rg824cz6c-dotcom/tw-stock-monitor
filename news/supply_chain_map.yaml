# ============================================================
# 地緣與總經事件的傳導路徑
# 這類事件不會提到任何台廠名稱，但透過原料、能源、運輸、需求、政策傳導。
# 用途：讓模型看到「某地開戰」時知道要往哪個方向推論，而不是直接略過。
# ============================================================

地緣事件傳導:

  烏俄戰爭類:
    說明: 東歐衝突、對俄制裁、黑海航運中斷
    傳導路徑:
      - 氖氣與氪氣：烏克蘭曾為半導體雷射用惰性氣體主要產地，供應中斷推升特氣成本
      - 鈀金：俄羅斯為主要產地，用於電子元件電鍍
      - 能源價格：歐洲天然氣影響當地晶圓廠與化工原料成本
    台廠觀察: [聯亞氣體, 三福化 4755, 崇越 5434, 台塑化 6505]
    註記: 2022 年後台廠已分散氖氣採購並提高自給率，衝擊程度低於當年

  中東與紅海類:
    說明: 中東衝突、紅海航運遇襲、荷姆茲海峽風險
    傳導路徑:
      - 海運費率與航程拉長，影響出貨成本與交期
      - 油價牽動塑化原料與運輸成本
    台廠觀察: [長榮 2603, 陽明 2609, 萬海 2615, 台塑 1301]

  台海情勢類:
    說明: 軍演、封鎖演練、地緣風險升高
    傳導路徑:
      - 客戶要求供應鏈分散，加速台廠海外設廠
      - 保險與運輸成本上升
      - 國際客戶調整下單比重，長期不利集中度
    台廠觀察: [台積電 2330, 鴻海 2317, 廣達 2382, 緯創 3231]
    註記: 短期股價反應常大於基本面影響，留意過度解讀

  中國出口管制類:
    說明: 稀土、鎵鍺銻、石墨等關鍵原料的出口限制
    傳導路徑:
      - 化合物半導體原料（鎵、鍺）影響功率元件與光通訊
      - 稀土影響馬達、磁性材料
    台廠觀察: [環球晶 6488, 中美晶 5483, 全新 2455, 穩懋 3105]

  美國出口管制類:
    說明: 對中設備、EDA、高階晶片的禁令與實體清單
    傳導路徑:
      - 台廠對中客戶出貨受限，但也可能承接轉單
      - 設備廠售後服務與零件供應受影響
    台廠觀察: [台積電 2330, 聯電 2303, 家登 3680, 帆宣 6196]

  天災類:
    說明: 台灣或日韓地震、颱風、停電、火災
    傳導路徑:
      - 晶圓廠震損與在製品報廢，短期產能損失
      - 日本地震影響矽晶圓、光阻劑、特殊化學品供應
    台廠觀察: [台積電 2330, 力積電 6770, 南亞科 2408, 崇越 5434]

  匯率與利率類:
    說明: 台幣大幅升貶、Fed 政策轉向
    傳導路徑:
      - 台幣升值侵蝕出口毛利，電子代工受影響較大
      - 利率影響資本支出意願與資料中心建置節奏
    台廠觀察: [廣達 2382, 緯創 3231, 鴻海 2317]
