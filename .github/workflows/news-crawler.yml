name: News Crawler

on:
  schedule:
    # 00:00 UTC = 08:00 台灣時間(趕在台股開盤前收到美股盤後消息)
    - cron: "0 0 * * *"
    # 12:00 UTC = 20:00 台灣時間
    - cron: "0 12 * * *"
  workflow_dispatch: {}

concurrency:
  group: news-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            news/requirements.txt

      - name: 安裝套件
        run: |
          pip install -r requirements.txt
          pip install -r news/requirements.txt

      - name: 寫入 .env(LLM / Gmail 設定)
        env:
          NEWS_ENV_FILE: ${{ secrets.NEWS_ENV_FILE }}
        run: printf '%s' "$NEWS_ENV_FILE" > news/.env

      - name: 從 Google Drive 下載 news.db
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python gdrive_sync.py pull

      - name: 抓取新聞並寄信
        env:
          PYTHONIOENCODING: utf-8
        working-directory: news
        run: python crawler.py

      - name: 把更新後的 news.db 傳回 Google Drive
        if: always()
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python gdrive_sync.py push
